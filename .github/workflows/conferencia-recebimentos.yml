name: Conferência de recebimentos

on:
  schedule:
    - cron: '50 17 * * *'
      timezone: America/Sao_Paulo
  workflow_dispatch:
    inputs:
      allow_partial:
        description: "Teste: conferir apenas empresas com planilha Rede disponível"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: conferencia-recebimentos
  cancel-in-progress: false

jobs:
  conferir-recebimentos:
    # O runner deve estar em uma sessão interativa para exibir o Chrome.
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 180
    env:
      CI: "true"
      PYTHONUTF8: "1"
      UV_SYSTEM_CERTS: "true"
      RECEBIMENTOS_HEADLESS: "false"
      RECEBIMENTOS_OPERA_USERNAME: ${{ secrets.RECEBIMENTOS_OPERA_USERNAME }}
      RECEBIMENTOS_OPERA_PASSWORD: ${{ secrets.RECEBIMENTOS_OPERA_PASSWORD }}
      RECEBIMENTOS_OPERA_HOTEL: ${{ secrets.RECEBIMENTOS_OPERA_HOTEL }}
      RECEBIMENTOS_OPERA_HOTEL_CHARME: ${{ secrets.RECEBIMENTOS_OPERA_HOTEL_CHARME || vars.RECEBIMENTOS_OPERA_HOTEL_CHARME }}
      RECEBIMENTOS_OPERA_HOTEL_CUMBUCO: ${{ secrets.RECEBIMENTOS_OPERA_HOTEL_CUMBUCO || vars.RECEBIMENTOS_OPERA_HOTEL_CUMBUCO }}
      RECEBIMENTOS_OPERA_HOTEL_TAIBA: ${{ secrets.RECEBIMENTOS_OPERA_HOTEL_TAIBA || vars.RECEBIMENTOS_OPERA_HOTEL_TAIBA }}
      RECEBIMENTOS_OPERA_HOTEL_MAGNA: ${{ secrets.RECEBIMENTOS_OPERA_HOTEL_MAGNA || vars.RECEBIMENTOS_OPERA_HOTEL_MAGNA }}
      RECEBIMENTOS_CMFLEX_USERNAME: ${{ secrets.RECEBIMENTOS_CMFLEX_USERNAME }}
      RECEBIMENTOS_CMFLEX_PASSWORD: ${{ secrets.RECEBIMENTOS_CMFLEX_PASSWORD }}
      RECEBIMENTOS_REDE_DIR: ${{ secrets.RECEBIMENTOS_REDE_DIR }}
      RECEBIMENTOS_ARCHIVE_ROOT: ${{ secrets.RECEBIMENTOS_ARCHIVE_ROOT }}

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar uv e Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Validar automação
        run: uv run python -m unittest discover -s tests/recebimentos -v

      - name: Validar configuração de recebimentos
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RECEBIMENTOS_OPERA_USERNAME) -or
              [string]::IsNullOrWhiteSpace($env:RECEBIMENTOS_OPERA_PASSWORD)) {
            throw "Configure os secrets RECEBIMENTOS_OPERA_USERNAME e RECEBIMENTOS_OPERA_PASSWORD no repositório."
          }
          if ([string]::IsNullOrWhiteSpace($env:RECEBIMENTOS_CMFLEX_USERNAME) -or
              [string]::IsNullOrWhiteSpace($env:RECEBIMENTOS_CMFLEX_PASSWORD)) {
            throw "Configure os secrets RECEBIMENTOS_CMFLEX_USERNAME e RECEBIMENTOS_CMFLEX_PASSWORD no repositório."
          }
          if ([string]::IsNullOrWhiteSpace($env:RECEBIMENTOS_REDE_DIR)) {
            throw "Configure o secret RECEBIMENTOS_REDE_DIR com a pasta da planilha Rede acessível ao runner."
          }

      - name: Conferir e arquivar relatórios
        run: uv run python main.py conferencia-recebimentos --all-companies ${{ inputs.allow_partial && '--allow-partial' || '' }}

      - name: Publicar relatório
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conferencia-recebimentos-${{ github.run_number }}
          path: output/recebimentos/
          if-no-files-found: warn
          retention-days: 30
