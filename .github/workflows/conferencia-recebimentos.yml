name: Conferência de recebimentos

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conferencia-recebimentos
  cancel-in-progress: false

jobs:
  download-opera:
    # O runner deve estar em uma sessão interativa para exibir o Chrome.
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    env:
      CI: "true"
      PYTHONUTF8: "1"
      UV_SYSTEM_CERTS: "true"
      RECEBIMENTOS_HEADLESS: "false"
      RECEBIMENTOS_OPERA_USERNAME: ${{ secrets.RECEBIMENTOS_OPERA_USERNAME }}
      RECEBIMENTOS_OPERA_PASSWORD: ${{ secrets.RECEBIMENTOS_OPERA_PASSWORD }}
      RECEBIMENTOS_OPERA_HOTEL: ${{ secrets.RECEBIMENTOS_OPERA_HOTEL }}
      RECEBIMENTOS_CMFLEX_USERNAME: ${{ secrets.RECEBIMENTOS_CMFLEX_USERNAME }}
      RECEBIMENTOS_CMFLEX_PASSWORD: ${{ secrets.RECEBIMENTOS_CMFLEX_PASSWORD }}
      RECEBIMENTOS_CMFLEX_COMPANY: ${{ secrets.RECEBIMENTOS_CMFLEX_COMPANY || vars.RECEBIMENTOS_CMFLEX_COMPANY }}
      RECEBIMENTOS_REDE_DIR: ${{ secrets.RECEBIMENTOS_REDE_DIR }}
      RECEBIMENTOS_ARCHIVE_ROOT: ${{ secrets.RECEBIMENTOS_ARCHIVE_ROOT }}

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar uv e Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Validar automação
        run: uv run python -m unittest discover -s tests/recebimentos -v

      - name: Validar configuração de recebimentos
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RECEBIMENTOS_OPERA_USERNAME) -or
              [string]::IsNullOrWhiteSpace($env:RECEBIMENTOS_OPERA_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:RECEBIMENTOS_OPERA_HOTEL)) {
            throw "Configure os secrets RECEBIMENTOS_OPERA_USERNAME, RECEBIMENTOS_OPERA_PASSWORD e RECEBIMENTOS_OPERA_HOTEL no repositório."
          }
          if ([string]::IsNullOrWhiteSpace($env:RECEBIMENTOS_CMFLEX_USERNAME) -or
              [string]::IsNullOrWhiteSpace($env:RECEBIMENTOS_CMFLEX_PASSWORD)) {
            throw "Configure os secrets RECEBIMENTOS_CMFLEX_USERNAME e RECEBIMENTOS_CMFLEX_PASSWORD no repositório."
          }
          if ([string]::IsNullOrWhiteSpace($env:RECEBIMENTOS_REDE_DIR)) {
            throw "Configure o secret RECEBIMENTOS_REDE_DIR com a pasta da planilha Rede acessível ao runner."
          }

      - name: Limpar relatório anterior
        shell: powershell
        run: |
          $reportDir = Join-Path $env:GITHUB_WORKSPACE "output\recebimentos"
          if (Test-Path -LiteralPath $reportDir) {
            Remove-Item -LiteralPath $reportDir -Recurse -Force
          }

      - name: Baixar relatório do OPERA
        run: uv run python main.py conferencia-recebimentos --baixar-opera

      - name: Baixar relatório do CMFlex
        run: uv run python main.py conferencia-recebimentos --baixar-cmflex

      - name: Conferir e arquivar relatórios
        run: uv run python main.py conferencia-recebimentos --conferir-baixados

      - name: Publicar relatório
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conferencia-recebimentos-${{ github.run_number }}
          path: output/recebimentos/
          if-no-files-found: warn
          retention-days: 30
