name: Conciliação Booking x OPERA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: booking-opera-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    # Runner Windows iniciado interativamente para exibir o navegador.
    # runs-on: [self-hosted, windows, x64]
    runs-on: self-hosted
    timeout-minutes: 90
    env:
      CI: "true"
      UV_SYSTEM_CERTS: "true"
      BOOKING_HEADLESS: "false"
      BOOKING_OUTPUT_DIR: output
      BOOKING_ARCHIVE_DIR: ${{ vars.BOOKING_ARCHIVE_DIR }}
      BOOKING_USERNAME: ${{ secrets.BOOKING_USERNAME }}
      BOOKING_PASSWORD: ${{ secrets.BOOKING_PASSWORD }}
      OPERA_USERNAME: ${{ secrets.OPERA_USERNAME }}
      OPERA_PASSWORD: ${{ secrets.OPERA_PASSWORD }}
      OPERA_HOTEL: ${{ secrets.OPERA_HOTEL }}

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar uv e Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Executar conciliação
        run: uv run python main.py booking-opera

      - name: Publicar relatórios
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: booking-opera-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
